# Calls the admin's scheduled-job routes. Each route checks the CRON_SECRET,
# which must match in two places: this repo's Actions secrets and the admin
# service's variables in Railway. See ACTION_ITEMS.md.
name: Scheduled jobs

on:
  schedule:
    - cron: "17 8 * * *"   # daily, 08:17 UTC
  workflow_dispatch:        # "Run workflow" button on the Actions tab

jobs:
  retention:
    # PRD v4 §7 Step 8c: delete raw taps, reactions and chat questions older
    # than 24 months, as the privacy page promises.
    runs-on: ubuntu-latest
    steps:
      - name: Delete expired raw data
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET isn't set in this repo's Actions secrets."
            exit 1
          fi
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" \
            https://admin.tapshelf.co/api/cron/retention
